<div class="row">
    <div class="col-lg-9 offset-lg-3 col-12 px-lg-5 px-md-4 px-sm-3 mt-3">
        <h2 class="mb-1">Famille</h2>
        <hr>
        <div class="row pt-3">
            <div class="col-12">
                <simple-text-details title="Père"
                    [text]="entity.father?.localeCivility(true) + ' ' + entity.father?.firstName + ' ' + entity.father?.lastName"
                    [empty]="!entity.father"></simple-text-details>
            </div>
            <div class="col-12 mt-3">
                <simple-text-details title="Mère"
                    [text]="entity.mother?.localeCivility(true) + ' ' + entity.mother?.firstName + ' ' + entity.mother?.lastName"
                    [empty]="!entity.mother"></simple-text-details>
            </div>
            <div class="col-12 mt-3">
                <simple-text-details title="Tuteur"
                    [text]="entity.tutor?.localeCivility(true) + ' ' + entity.tutor?.firstName + ' ' + entity.tutor?.lastName"
                    [empty]="!entity.tutor"></simple-text-details>
            </div>
        </div>
    </div>
</div>
