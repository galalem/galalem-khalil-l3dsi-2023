<app-dialog #dialog>
  <ng-container dialog-title>Supprimer</ng-container>
  <p>Êtes-vous sûr de bien vouloir supprimer {{subject}}.<br>Cette action est irréversible!</p>
  <ng-container dialog-actions>
    <button class="ml-1 btn btn-sm btn-secondary" (click)="dialog.close()">Non Merci</button>
    <button class="ml-1 btn btn-sm btn-danger" (click)="data.handler(); confirm.emit(); dialog.close()">Supprimer</button>
  </ng-container>
</app-dialog>
