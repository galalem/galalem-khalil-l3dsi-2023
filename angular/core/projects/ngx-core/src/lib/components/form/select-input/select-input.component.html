<div class="{{classes}}">
    <mat-form-field appearance="outline">
        <mat-label>{{label}}</mat-label>
        <ng-container *ngIf="!native">
            <mat-select [(ngModel)]="value" #input="ngModel" [required]="required" [disabled]="disabled">
                <mat-option *ngFor="let opt of options" [value]="opt.value" [disabled]="opt.disabled">
                {{opt.label}}
                </mat-option>
            </mat-select>

            <mat-hint *ngIf="hint" class="text-sm text-muted">{{hint}}</mat-hint>
            <mat-error *ngIf="input.invalid && (input.dirty || input.touched)" class="text-sm">
                <span *ngIf="input.errors?.['required']">Ce champ est obligatoire *</span>
            </mat-error>
        </ng-container>

        <ng-container *ngIf="native">
            <select matNativeControl [(ngModel)]="value" #input="ngModel" [required]="required" [disabled]="disabled">
                <option *ngFor="let opt of options" [value]="opt.value" [disabled]="opt.disabled">
                    {{opt.label}}
                </option>
            </select>

            <mat-hint *ngIf="hint" class="text-sm text-muted">{{hint}}</mat-hint>
            <mat-error *ngIf="input.invalid && (input.dirty || input.touched)" class="text-sm">
                <span *ngIf="input.errors?.['required']">Ce champ est obligatoire *</span>
            </mat-error>
        </ng-container>

        <span matTextPrefix *ngIf="textPrefix">{{textPrefix}}</span>
        <span matTextSuffix *ngIf="textSuffix">{{textSuffix}}</span>
    </mat-form-field>
</div>
