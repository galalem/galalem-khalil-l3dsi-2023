<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <app-alert #alert></app-alert>
        </div>
        <div class="col-12">
            <form #formCtrl="ngForm">
                <div class="card">
                    <div class="card-body">
                        <div class="row mb-2">
                            <div class="col-12">
                                <text-input [(ngModel)]="entity.label" label="Libelle" name="label" [required]="true"/>
                            </div>
                            <div class="col-12">
                                <dialog-input label="Enseignant" [display]="entity.teacher.id ? entity.teacher.name() : ''" (requestDialog)="showTeachersDialog()"/>
                            </div>
                            <div class="col-12">
                                <text-input type="color" [(ngModel)]="entity.color" label="Couleur" name="color" [required]="true"/>
                            </div>
                            <div class="col-12">
                                <select-input [(ngModel)]="entity.shared" label="Ciblant" name="shared" [required]="true" [options]="[{value: true, label: 'Toute la classe'}, {value: false, label: 'Elèves Spécifiques'}]"/>
                            </div>
                            <div class="col-12" *ngIf="!entity.shared">
                                <div class="card">
                                    <div class="card-body">
                                        <ion-chip [outline]="true" color="primary" *ngIf="!entity.students.length">
                                            <ion-label>Prénom Nom</ion-label>
                                            <ion-icon name="close"></ion-icon>
                                        </ion-chip>
                                        <ion-chip [outline]="true" color="primary" *ngFor="let student of entity.students">
                                            <ion-label>{{student.firstName}} {{student.lastName}}</ion-label>
                                            <ion-icon name="close" (click)="pluckStudent(student.id)"></ion-icon>
                                        </ion-chip>
                                        <ion-chip [outline]="false" color="primary" class="no-print" (click)="showStudentsDialog()">
                                            <ion-icon name="add" class="m-0"></ion-icon>
                                        </ion-chip>
                                    </div>
                                </div>

                            </div>
                            <div class="col-12">
                                <data-table [source]="entity.sessions" [config]="dataTableConfig"></data-table>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-block btn-lg my-3" (click)="submit()">
                            Soumettre
                        </button>
                    </div>
                </div>
            </form>
        </div>
        <alert-dialog #sessionDialog (confirm)="createSession(session)">
            <ng-container dialog-title>
                {{session.id ? 'Modifier' : 'Nouvelle'}} Session
            </ng-container>

            <h5>Jour</h5>
            <div class="form-group">
                <div class="input-group">
                    <select class="form-control" [(ngModel)]="session.day">
                        <option *ngFor="let option of [{ label: 'Lundi', value: 0 }, { label: 'Mardi', value: 1 }, { label: 'Mercredi', value: 2 }, { label: 'Jeudi', value: 3 }, { label: 'Vendredi', value: 4 }, { label: 'Samedi', value: 5 }, { label: 'Dimanche', value: 6 }]" [value]="option.value">{{option.label}}</option>
                    </select>
                </div>
            </div>
            <h5>Horaires</h5>
            <div class="form-group d-flex" style="gap: .25rem;">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text">de</span>
                    </div>
                    <input type="time" class="form-control" [(ngModel)]="session.start"/>
                </div>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text">à</span>
                    </div>
                    <input type="time" class="form-control" [(ngModel)]="session.end"/>
                </div>
            </div>
            <h5>Salle</h5>
            <div class="form-group">
                <div class="input-group">
                    <input class="form-control" [(ngModel)]="session.place">
                </div>
            </div>
            <h5>Par Groupe</h5>
            <div class="form-group">
                <div class="input-group">
                    <select class="form-control" [(ngModel)]="session.group">
                        <option *ngFor="let option of [{ label: 'Non', value: null }, { label: 'Groupe 1', value: 1 }, { label: 'Groupe 2', value: 2 }]" [value]="option.value">{{option.label}}</option>
                    </select>
                </div>
            </div>
            <h5>Par Quinzaine</h5>
            <div class="form-group">
                <div class="input-group">
                    <select class="form-control" [(ngModel)]="session.fortnight">
                        <option *ngFor="let option of [{ label: 'Non', value: null }, { label: 'Semaine A', value: true }, { label: 'Semaine B', value: 2 }]" [value]="option.value">{{option.label}}</option>
                    </select>
                </div>
            </div>
            <div style="margin: 0; min-width: 40vw;"></div>
        </alert-dialog>
    </div>
</div>
